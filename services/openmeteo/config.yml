# Open-Meteo weather forecast API — free, no API key needed.
# Docs: https://open-meteo.com/en/docs
config_version: 1
name: openmeteo
title: Open-Meteo Weather
description: |
  Current weather and forecasts (hourly up to 7 days, daily up to 16 days) for any location,
  by latitude/longitude. Use the geocoding tools first to turn a place name into coordinates.
  Weather codes are WMO codes: 0 clear, 1-3 mainly clear/partly cloudy/overcast, 45/48 fog,
  51-57 drizzle, 61-67 rain, 71-77 snow, 80-82 rain showers, 85-86 snow showers, 95-99 thunderstorm.
tags: [weather, external, free]
docs_url: https://open-meteo.com/en/docs

tools:
  separator: "_"                  # tool names like openmeteo_get_current

base_url: https://api.open-meteo.com/{version}
url_variables:
  version:
    default: v1

auth:
  type: none

http:
  headers:
    Accept: application/json
  timeout:
    total_ms: 10000

retry:
  max_attempts: 3
  on_status: [429, 502, 503, 504]
  backoff: { type: exponential, initial_ms: 300, max_ms: 3000, jitter: full }

rate_limit:                       # free tier allows 600 calls/minute
  requests: 600
  per: minute
  on_limit: wait

cache:                            # forecasts update every ~15 minutes
  enabled: true
  ttl_s: 300

response:
  format: json
  max_chars_to_model: 12000

errors:
  include_body: true              # Open-Meteo explains 400s in {"reason": "..."}
  messages:
    "400": Open-Meteo rejected the request — see the reason below.
    "429": Open-Meteo rate limit reached, try again in a minute.
    "5xx": Open-Meteo is having problems, try again later.

security:
  read_only: true

logging:
  level: info
  log_requests: true
